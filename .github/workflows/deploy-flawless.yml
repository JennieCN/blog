name: Build and Deploy to Flawless

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-flawless
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro and Pagefind
        run: npm run build

      - name: Verify build and content
        run: |
          node scripts/verify-build.mjs
          node scripts/verify-cms.mjs
          node scripts/verify-content.mjs

      - name: Deploy dist to flawless
        env:
          DEPLOY_KEY: ${{ secrets.FLAWLESS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '[68.166.252.15]:5522 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINMaI5f/cO7YNNI4c0HHmdCKzPiZR0V29YqtyYomR5QK' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh \
            -i ~/.ssh/deploy_key \
            -p 5522 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            root@68.166.252.15
          rm -f ~/.ssh/deploy_key
