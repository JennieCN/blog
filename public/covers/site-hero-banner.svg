<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c3b5e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="22%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="80%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38bdf8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <pattern id="subgrid" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M 240 0 L 0 0 0 240" fill="none" stroke="#7dd3fc" stroke-opacity="0.13" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="1920" height="640" fill="url(#hbg)"/>
  <rect width="1920" height="640" fill="url(#glowA)"/>
  <rect width="1920" height="640" fill="url(#glowB)"/>
  <rect width="1920" height="640" fill="url(#grid)"/>
  <rect width="1920" height="640" fill="url(#subgrid)"/>

  <!-- Subtle network topology curves & nodes (kept subtle so center white site title pops cleanly) -->
  <g fill="none" stroke-width="1.5" stroke-opacity="0.24">
    <path d="M -40 480 C 320 340, 620 520, 960 390 S 1580 220, 1960 340" stroke="#38bdf8"/>
    <path d="M -40 210 C 380 330, 740 130, 1140 260 S 1640 450, 1960 190" stroke="#818cf8"/>
    <path d="M 180 660 C 520 430, 940 470, 1380 180 S 1740 120, 1960 90" stroke="#2dd4bf" stroke-dasharray="6 8"/>
  </g>
  <g fill="#7dd3fc" fill-opacity="0.45">
    <circle cx="240" cy="240" r="4.5"/>
    <circle cx="480" cy="432" r="5"/>
    <circle cx="720" cy="192" r="4"/>
    <circle cx="1200" cy="288" r="5"/>
    <circle cx="1440" cy="192" r="4.5"/>
    <circle cx="1680" cy="384" r="5"/>
  </g>
  <rect width="1920" height="640" fill="#020617" fill-opacity="0.22"/>
</svg>
