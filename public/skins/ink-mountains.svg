<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="far" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="mid" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="wash" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f1d1a" stop-opacity=".22"/><stop offset="1" stop-color="#1f1d1a" stop-opacity="0"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f1d1a" stop-opacity=".42"/><stop offset=".85" stop-color="#1f1d1a" stop-opacity=".02"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f1d1a" stop-opacity=".7"/><stop offset=".9" stop-color="#1f1d1a" stop-opacity=".05"/></linearGradient>
  </defs>
  <!-- 远山 -->
  <path filter="url(#far)" fill="url(#g1)" d="M0 260 C 90 210 150 170 230 190 C 300 205 330 120 420 110 C 500 100 540 190 620 200 C 700 210 760 150 850 140 C 940 130 990 210 1080 205 C 1170 200 1210 120 1300 115 C 1390 110 1450 190 1520 200 C 1560 205 1590 195 1600 190 L1600 420 L0 420 Z"/>
  <!-- 中景 -->
  <path filter="url(#mid)" fill="url(#g2)" d="M0 330 C 60 300 110 250 170 260 C 230 270 250 210 310 200 C 360 192 380 240 430 270 C 480 300 540 240 600 250 C 660 260 700 320 780 310 C 860 300 900 230 980 225 C 1040 222 1070 280 1130 290 C 1200 300 1250 250 1320 245 C 1400 240 1440 300 1510 305 C 1550 308 1580 300 1600 295 L1600 420 L0 420 Z"/>
  <!-- 近山（带皴擦） -->
  <path filter="url(#wash)" fill="url(#g3)" d="M0 380 C 40 360 80 330 130 335 C 170 340 190 300 240 290 C 280 283 300 330 340 350 C 380 370 420 340 460 345 C 520 352 540 395 600 400 L0 420 Z"/>
  <path filter="url(#wash)" fill="url(#g3)" d="M1050 405 C 1110 380 1150 330 1210 320 C 1260 312 1280 270 1340 262 C 1390 256 1410 300 1450 320 C 1490 340 1530 320 1570 330 C 1585 334 1595 340 1600 342 L1600 420 L1050 420 Z"/>
  <!-- 飞鸟 -->
  <g fill="none" stroke="#1f1d1a" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
    <path d="M1160 120 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M1205 100 q 6 -6 12 0 q 6 -6 12 0"/>
    <path d="M1135 92 q 5 -5 10 0 q 5 -5 10 0"/>
  </g>
</svg>
